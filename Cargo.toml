[package]
name = "tracker-gpui"
version = "0.1.0"
edition = "2021"
rust-version = "1.99"
license = "GPL-3.0-or-later"
repository = "https://github.com/dfshfghj/tracker-gpui"

[features]
default = []
vision = ["dep:opencv"]

[dependencies]
gpui-kit = "0.7.3"
gpui-component = "0.7.3"
rust-i18n = "4.2"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
libc = "0.2"
ffmpeg-the-third = { version = "=6.0.0", default-features = false, features = [
  "codec",
  "format",
  "software-scaling",
] }
image = { version = "0.25.1", default-features = false, features = ["jpeg", "png"] }
smallvec = "1"
resvg = { version = "0.46.0", default-features = false, features = ["text", "system-fonts"] }
raw-window-handle = "0.6"
opencv = { version = "0.101.1", optional = true, default-features = false, features = [
  "imgproc",
  "video",
  "imgcodecs",
  "objdetect",
  "calib3d",
] }

[profile.dev]
opt-level = 1
debug = 1

[profile.dev.package."*"]
opt-level = 2
debug = 0

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = false
strip = "symbols"
incremental = false

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", features = ["test-support"] }
